services:
  db:
    image: pgvector/pgvector:pg17
    container_name: assistant-db
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5433:5432"
    volumes:
      - assistant_pgdata:/var/lib/postgresql/data
volumes:
  assistant_pgdata:
